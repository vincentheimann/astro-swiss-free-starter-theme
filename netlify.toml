[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://demo.astroswiss.ch/*"
  to = "https://demo.astroswiss.com/:splat"
  status = 301
  force = true

# No SPA catch-all: this is a static multi-page site. Missing URLs must return
# a real 404 (Netlify serves dist/404.html automatically), not the homepage.